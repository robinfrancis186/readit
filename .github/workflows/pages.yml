# Publishes the project page in site/ to GitHub Pages.
#
# One-time setup, which only a repository admin can do:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
# The page is a description of Readit, not the application — Readit needs a
# server and a disk, which GitHub Pages does not provide. See docs/DEPLOY.md.
name: Deploy project page

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
