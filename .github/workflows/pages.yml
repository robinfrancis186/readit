# Publishes the project page in site/ to GitHub Pages.
#
# One-time setup, which only a repository admin can do:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
# The page is a description of Readit, not the application — Readit needs a
# server and a disk, which GitHub Pages does not provide. See docs/DEPLOY.md.
name: Deploy project page

on:
  push:
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Publish only from the default branch, whatever it is called. Hard-coding
    # `main` means nothing deploys in a repository whose default is named
    # something else.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages must already be enabled for the repository. The workflow token is
      # not permitted to create the site (`enablement: true` fails with
      # "Resource not accessible by integration"), so this is a one-time manual
      # step for an admin:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      # Until then this step fails, saying exactly that.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
