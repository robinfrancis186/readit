# Typecheck, unit tests, and a real Docker build.
#
# The Docker build is here because it is the deployment artifact: if the image
# stops building, every deployment path is broken, and that should fail loudly
# rather than at deploy time.
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: readit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot it and check it serves
        run: |
          docker run -d --name readit -p 4000:4000 \
            -e READIT_PASSWORD=ci-secret readit:ci
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/api/health > /dev/null; then break; fi
            sleep 2
          done
          echo "--- health ---"
          curl -sf http://localhost:4000/api/health
          echo "--- the library must refuse an unauthenticated request ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/api/library)
          test "$code" = "401" || { echo "expected 401, got $code"; docker logs readit; exit 1; }
          echo "--- both dictionaries must have loaded ---"
          curl -s -c jar -X POST http://localhost:4000/api/auth/login \
            -H 'Content-Type: application/json' -d '{"password":"ci-secret"}' > /dev/null
          stats=$(curl -s -b jar http://localhost:4000/api/dictionary/stats)
          echo "$stats"
          echo "$stats" | grep -q '"datuk"'   || { echo "Malayalam dictionary missing"; exit 1; }
          echo "$stats" | grep -q '"wordnet"' || { echo "English dictionary missing";  exit 1; }
      - name: Logs on failure
        if: failure()
        run: docker logs readit || true
