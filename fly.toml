# Fly.io deployment for Readit.
#
#   fly launch --no-deploy          # pick a unique app name; app names are global
#   fly volumes create readit_data --size 3 --region bom
#   fly secrets set READIT_PASSWORD='a long passphrase'
#   fly deploy
#
# Two things matter more than the rest. The volume, because without it the
# library is wiped on every redeploy. And the password, because Readit has no
# accounts and a fly.dev URL is public. See docs/DEPLOY.md.

# "readit" is almost certainly taken — app names are global on Fly. `fly launch`
# will ask for a free one and rewrite this line.
app = "readit"

# Mumbai. Lookups and page turns are interactive, so the round trip is felt on
# every one; this is the closest region to Kerala. The volume must be created in
# the same region as the machine.
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "4000"
  READIT_DATA_DIR = "/data"

[[mounts]]
  source = "readit_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # One machine, because the SQLite file and the uploaded books live on one
  # volume. Scaling out would need shared storage and a different database.
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  # Generous, because the very first boot loads 355,671 dictionary entries
  # before it starts listening. On a shared CPU that takes a while, and a check
  # that fails during it would restart the machine into the same slow start.
  grace_period = "90s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
